name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No package.json / deps — syntax-check the three node entrypoints.
      - name: node syntax check
        run: |
          node --check router.js
          node --check cli.js
          node --check rllm
