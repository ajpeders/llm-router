name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - name: node syntax check
        run: |
          node --check router.js
          node --check cli.js
          node --check rllm
      - name: tests
        run: node --test test/
