services:
  llm-router:
    container_name: llm-router
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - BACKENDS_JSON=${LLM_ROUTER_BACKENDS_JSON}
      - DEFAULT_SLOTS=${LLM_ROUTER_DEFAULT_SLOTS:-2}
      - DB_PATH=/data/jobs.db
      - BATCH_TIMEOUT_MS=${LLM_ROUTER_BATCH_TIMEOUT_MS:-1800000}
      - NONSTREAM_TIMEOUT_MS=${LLM_ROUTER_NONSTREAM_TIMEOUT_MS:-1800000}
      - IDLE_WINDOW_MS=${LLM_ROUTER_IDLE_WINDOW_MS:-120000}
      - NTFY_URL=${LLM_ROUTER_NTFY_URL:-}
      - NTFY_TOKEN=${LLM_ROUTER_NTFY_TOKEN:-}
    volumes:
      - ../../state/llm-router:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.llm-router.rule=Host(`${LLM_ROUTER_DOMAIN}`)
      - traefik.http.routers.llm-router.entrypoints=websecure
      - traefik.http.routers.llm-router.tls=true
      - traefik.http.routers.llm-router.tls.certresolver=letsencrypt
      - traefik.http.routers.llm-router.middlewares=local-only@file
      - traefik.http.services.llm-router.loadbalancer.server.port=8080
    networks:
      - web

networks:
  web:
    external: true
    name: web
